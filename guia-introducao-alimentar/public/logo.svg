<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Marca Nosso Pediatra — recriação vetorial fiel do logo original
    (coração com família amparado por uma mão, estilo paper-cut).
    Para usar o arquivo raster original no lugar, substitua os usos de
    logo.svg por ele (mesmas dimensões quadradas).
  -->
  <!-- coração externo -->
  <path
