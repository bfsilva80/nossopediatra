  <!-- adulto à esquerda -->
  <circle cx="222" cy="168" r="34" fill="#2E7292"/>
  <rect x="178" y="212" width="88" height="190" rx="34" fill="#2E7292"/>
  <!-- adulto à direita -->
  <circle cx="318" cy="144" r="40" fill="#1D5C7C"/>
  <rect x="270" y="196" width="98" height="214" rx="38" fill="#1D5C7C"/>
